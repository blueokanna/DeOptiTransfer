[package]
name = "deopti_transfer"
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/blueokanna/DeOptiTransfer"
readme = "README.md"
description = "A no_std LT fountain-code core with bounded decoding and optional authenticated or judge-recoverable encryption."
exclude = ["creative.md"]
keywords = ["fountain", "lt-code", "qr", "optical", "transfer"]
categories = ["encoding", "compression", "cryptography", "no-std"]

[features]
default = ["std"]
std = ["dep:flate2"]
encryption = [
    "dep:argon2",
    "dep:chacha20poly1305",
    "dep:getrandom",
    "dep:zeroize",
    "dep:x25519-dalek",
]

[dependencies]
rustbinary = { version = "0.1.4", default-features = false, features = [
    "alloc",
] }
serde = { version = "1", default-features = false, features = [
    "derive",
    "alloc",
] }
blake3 = { version = "1.8.6", default-features = false }
libm = "0.2"
argon2 = { version = "0.5", default-features = false, features = [
    "alloc",
], optional = true }
chacha20poly1305 = { version = "0.11", default-features = false, features = [
    "alloc",
], optional = true }
getrandom = { version = "0.4", default-features = false, optional = true }
zeroize = { version = "1.8", default-features = false, optional = true }
x25519-dalek = { version = "3.0.0", default-features = false, features = [
    "static_secrets",
    "zeroize",
], optional = true }
flate2 = { version = "1.1.9", default-features = false, features = [
    "rust_backend",
], optional = true }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "bench"
harness = false

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
